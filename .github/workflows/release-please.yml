name: release-please

# Maintains a release PR from Conventional Commits on main. Merging that PR tags
# the release, creates the GitHub Release and updates CHANGELOG.md, and then
# builds the installable app archive and attaches it to that release. The build
# lives in this workflow rather than reacting to the release event: releases
# created with the default GITHUB_TOKEN do not trigger further workflow runs, so
# a separate release-triggered workflow would never start (and working around
# that would mean maintaining a PAT).
#
# This publishes the unsigned archive only. Pushing to the Nextcloud App Store
# additionally requires the archive to be signed with the app's release
# certificate; that step is added once the app id is registered there.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

      # Build from the tag, not from the pushed commit: the run was triggered by
      # the pre-bump commit, while the version release-please just wrote to
      # appinfo/info.xml (which names the archive) lives on the tag.
      - if: steps.release.outputs.release_created
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - if: steps.release.outputs.release_created
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - if: steps.release.outputs.release_created
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - if: steps.release.outputs.release_created
        run: scripts/package.sh dist

      - if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" dist/atrium_secureshare-*.tar.gz

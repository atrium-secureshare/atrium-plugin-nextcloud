name: release-please

# Maintains a release PR from Conventional Commits on main. Merging it tags the
# release and updates CHANGELOG.md, then hands the tag to release.yml.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    # Named, not `secrets: inherit` — that would pass every repository secret.
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      APP_CERTIFICATE: ${{ secrets.APP_CERTIFICATE }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}

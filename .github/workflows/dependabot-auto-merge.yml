name: Dependabot auto-merge

# Enable auto-merge for Dependabot's semver-minor and semver-patch PRs. GitHub
# then merges them once the required CI checks (see ci.yml) pass. Squash-merge
# keeps the "fix:"/"chore:" prefixed PR title as the commit on main, which
# release-please consumes. Major bumps are left for manual review.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge for minor/patch updates
        if: contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.meta.outputs.update-type)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

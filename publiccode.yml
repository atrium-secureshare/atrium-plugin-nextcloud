      - https://raw.githubusercontent.com/atrium-secureshare/atrium-plugin-nextcloud/main/docs/screenshots/nextcloud-admin.png
      - https://raw.githubusercontent.com/atrium-secureshare/atrium-plugin-nextcloud/main/docs/screenshots/core-listing.png

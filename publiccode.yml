description:
  en:
    localisedName: Atrium Secureshare for Nextcloud
    shortDescription: Identity-bound external file sharing from the native Nextcloud sharing sidebar
    longDescription: |
      Atrium Secureshare lets staff share files with people outside the
      organisation directly from Nextcloud, without provisioning accounts for
      those recipients and without exposing Nextcloud to the public internet.

      The app adds an Atrium section to the native Files sharing sidebar, where
      an owner creates and manages external shares addressed to a recipient's
      email address. The recipient never reaches Nextcloud: they authenticate
      against the organisation's identity provider and collect the file through
      the Atrium Secureshare Core gateway, which enforces multi-factor
      authentication, acceptance of the Terms of Service and a full audit trail.
      Only the gateway is internet-facing, so Nextcloud can stay in the internal
      network.

      Because recipients are never entries in the Nextcloud user directory, they
      cannot impersonate internal staff in the address book, they leave no stale
      guest objects behind and they do not count towards user limits. Shares can
      be files or folders, carry an expiry date and, for files, a maximum
      download count. Folder shares can be read-only, a dropzone that only
      accepts uploads, or a workspace in which recipients see either just their
      own uploads or the whole folder. Shared items show Nextcloud's own native
      "Shared" indicator, so there is no parallel user interface.

      Administrators configure the trust key, portal URL, email and share policy,
      brand name and retention policy from a settings page inside Nextcloud.

      This app is the Nextcloud side of Atrium Secureshare only. It requires the
      Atrium Secureshare Core gateway, which is published separately and runs as
      its own deployment.
    documentation: https://github.com/atrium-secureshare/atrium-plugin-nextcloud/tree/main/docs
    features:
      - Identity-bound shares created from the native Files sharing sidebar
      - No Nextcloud account, guest account or licence for external recipients
      - Nextcloud stays off the public internet, only the gateway is exposed
      - Expiry dates and download caps per share
      - Read-only, write-only and read-own folder shares
      - Native "Shared" indicator and a shares overview in the Files navigation
      - Email invitations to the branded portal instead of direct file links
      - Admin settings for trust key, portal URL, share and email policy
      - Retention policy that purges expired and revoked shares
    screenshots:
